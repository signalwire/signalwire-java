import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.29.0'
    // FMT gate: Spotless drives google-java-format over all Java sources. The
    // run-ci.sh FMT gate runs `spotlessApply` locally (auto-fix) and
    // `spotlessCheck` in CI (read-only). google-java-format is the canonical
    // Java formatter — analogous to gofmt/rustfmt — so there is no style to
    // bikeshed and the reformat is provably surface/emission-neutral.
    id 'com.diffplug.spotless' version '6.25.0'
    // LINT gate (two layers, both blocking, both burned to zero):
    //   1. Error Prone — Google's compile-time bug-pattern checker, wired via
    //      the net.ltgt.errorprone plugin with warnings-as-errors.
    //   2. Checkstyle — the gradle built-in plugin, config in config/checkstyle.
    id 'net.ltgt.errorprone' version '3.1.0'
    id 'checkstyle'
}

group = 'com.signalwire'
version = '3.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Preserve method-parameter names in compiled bytecode. Required by the
// signature-audit adapter (scripts/SignatureDump.java) which reads
// parameter names via reflection; without -parameters they show up as
// arg0/arg1/... and the diff against the Python reference loses them.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON
    implementation 'com.google.code.gson:gson:2.14.0'

    // YAML — used by PromptObjectModel.fromYaml/toYaml for byte-identical
    // round-trip parity with Python's pyyaml-based pom.py.
    implementation 'org.yaml:snakeyaml:2.6'

    // WebSocket for RELAY
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    // Servlet API — compileOnly so the Servlet WebhookFilter compiles for
    // users running on Tomcat / Jetty / similar containers, but doesn't drag
    // any servlet runtime into apps that use the JDK HttpServer-based
    // AgentServer. Per porting-sdk/webhooks.md the Java port MUST ship a
    // servlet-style filter.
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // LINT gate — Error Prone bug-pattern checker (runs in the compiler).
    errorprone 'com.google.errorprone:error_prone_core:2.27.1'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Servlet API on the test classpath so the WebhookFilter tests can
    // compile against javax.servlet.* without forcing it into the SDK
    // runtime.
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
}

test {
    useJUnitPlatform()
}

// FMT gate — Spotless + google-java-format over EVERY Java source in the repo:
// the SDK (src/main), the tests (src/test), all three example trees (examples/,
// rest/examples/, relay/examples/) and the audit helper (scripts/
// SignatureDump.java). There is ONE formatting bar and every directory meets it
// — examples and tests are shipping code too, so nothing is carved out. The only
// thing NOT formatted is build output (build/, .gradle/), which is not source.
// The formatter is source-style only and proven surface/emission-neutral (a
// reformat leaves port_signatures.json + port_surface.json byte-identical and
// EMISSION 81/81 — verified during the rollout). run-ci.sh's FMT gate runs
// `spotlessApply` locally and `spotlessCheck` in CI.
spotless {
    java {
        target 'src/**/*.java', 'examples/**/*.java', 'rest/examples/**/*.java',
               'relay/examples/**/*.java', 'scripts/**/*.java'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// LINT gate, layer 1 — Error Prone. Runs inside javac as a bug-pattern
// checker. Warnings-as-errors so any pattern Error Prone flags fails the
// build (and thus the LINT gate). MEASURE-ONLY toggle: pass
// -PerrorproneMeasure to demote everything to a warning so the raw burndown
// volume can be counted without failing the build.
import net.ltgt.gradle.errorprone.CheckSeverity
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        if (project.hasProperty('errorproneMeasure')) {
            // MEASURE-ONLY: demote everything to a warning so the raw burndown
            // volume can be counted without failing the build.
            allErrorsAsWarnings = true
        } else {
            // Burndown floor: every Error Prone bug pattern is an ERROR (the
            // build, and thus the LINT gate, fails on any finding). The whole
            // default bug-pattern set was burned to zero in the rollout.
            allErrorsAsWarnings = false
        }
        // The three Javadoc-PROSE checks below are turned OFF (not suppressed
        // per-site). They police documentation completeness/markup quality —
        // LLM-irrelevant prose, never wire/surface/correctness — so per
        // porting-sdk RULES.md they are idiom, not a parity floor. Turning them
        // off keeps the gate focused on real bug patterns rather than forcing
        // boilerplate "@return the foo" summaries onto self-evident accessors.
        check('MissingSummary', CheckSeverity.OFF)   // javadoc summary fragment
        check('InvalidLink', CheckSeverity.OFF)       // javadoc {@link} resolution
        check('EscapedEntity', CheckSeverity.OFF)     // javadoc HTML-entity prose
        // The three checks below are OFF with a specific rationale — each would
        // force an API/contract change, never a wire/surface change, so per
        // RULES.md they cannot be obeyed without de-idiomatizing the port:
        //   * AnnotateFormatMethod — adding @FormatMethod to Logger.log()
        //     cascades FormatStringAnnotation errors onto every debug/info/warn/
        //     error caller and up the whole logging call chain; annotating the
        //     entire logging API to satisfy one site is not idiomatic.
        //   * IterableAndIterator — PaginatedIterator is a public final SDK type
        //     using the standard self-iterable pattern (implements both); the
        //     only "fix" is dropping a public interface = a surface change.
        // (JdkObsolete is NOT in this list: it used to be, to accommodate ONE
        //  test site, which turned a per-site fact into a repo-wide blind spot.
        //  It is now ON everywhere and suppressed at that single site with its
        //  reason — see WebhookFilterTest.Handler#invoke.)
        check('AnnotateFormatMethod', CheckSeverity.OFF)
        check('IterableAndIterator', CheckSeverity.OFF)
        // PROMOTED to ERROR. ObjectToString ships as a mere WARNING, so it did
        // not fail the gate — and it caught a real defect the moment lint first
        // reached examples/: RestDemo printed an AvailablePhoneNumbersResponse
        // (a final DTO with no toString()) by concatenation, so the demo emitted
        // "AvailablePhoneNumbersResponse@4488aabb" instead of any phone number.
        // The whole REST surface is generated pure-data DTOs with no toString(),
        // so this is a repeatable trap for anyone writing an example or a log
        // line. Repo-wide cost of the promotion: zero — that one site was the
        // only occurrence, and it is fixed.
        check('ObjectToString', CheckSeverity.ERROR)
    }
}

// LINT gate, layer 2 — Checkstyle. Config authored in config/checkstyle/
// checkstyle.xml; the rule set is a Google/Sun-derived style consistent with
// what google-java-format produces (it does NOT fight the formatter). Burned
// to zero; maxWarnings=0 so any violation fails the gate.
checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    maxErrors = 0
    ignoreFailures = project.hasProperty('checkstyleMeasure')
}

// Print the runtime classpath, one entry per line. Used by the doc-audit
// example-compile step so example sources can find every dep the SDK
// itself uses (Gson, etc.) without re-pinning versions in CI.
tasks.register('printRuntimeClasspath') {
    doLast {
        configurations.runtimeClasspath.each { println it }
    }
}

// ── examples/ build+run target (EXAMPLES-RUN gate) ──────────────────
// The examples/ dir holds default-package standalone mains (SimpleAgent,
// RestDemo, ...). Prior to this there was NO gradle target that built + ran
// them, so porting-sdk/scripts/examples_run.py SKIPPED java entirely and the
// runtime-crash-on-load class (a builder that throws before its first network
// call, a deleted SDK method, a wrong-arity call) went uncaught by any gate.
//
// An `examples` source set compiles every examples/*.java against the SDK's
// own runtime classpath (so examples resolve Gson etc. without re-pinning),
// and `runExample -PexampleClass=<ClassName>` runs one built example. The
// examples-run gate invokes this once per example, injecting the mock
// SIGNALWIRE_* env + MOCK_SIGNALWIRE_PORT the same way the REST-COVERAGE gate
// and tests do.
sourceSets {
    examples {
        java {
            // All three example trees compile into the examples source set. The
            // EXAMPLES-RUN gate (porting-sdk/scripts/examples_run.py §2.2) globs
            // examples/ AND rest/examples/ AND relay/examples/, then runs each by
            // simple class name via `runExample -PexampleClass=<ClassName>`. All
            // three dirs use the default package (no package decl) with unique
            // class names, so they share one flat namespace here; omitting the
            // rest/ + relay/ dirs left their classes uncompiled and every
            // `runExample` for them died with ClassNotFoundException.
            srcDir 'examples'
            srcDir 'rest/examples'
            srcDir 'relay/examples'
            // Default package (no package decl), on the SDK runtime classpath.
            compileClasspath += sourceSets.main.runtimeClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
}

// LINT/FMT SCOPE: the WHOLE tree. The `examples` source set above is linted at
// exactly the bar src/main and src/test meet — Error Prone warnings-as-errors
// plus Checkstyle, zero findings — and formatted by Spotless. Examples and tests
// are shipping code: a user copies an example verbatim, so a real bug in one is a
// real bug shipped. Nothing here is excluded; there is no vendored third-party
// Java in this repo, so there is nothing that could legitimately be.
//
// (This replaced a carve-out that set `options.errorprone.enabled = false` on
//  compileExamplesJava and disabled checkstyleExamples outright, on the rationale
//  that "an unused import in a demo must not fail the SDK build". Removing it
//  found real defects in the example trees — see the commits that burned it down.)

// The audit helper scripts/SignatureDump.java sits outside src/ and is compiled
// by raw javac from scripts/enumerate_signatures.py, so no Gradle source set saw
// it and NO lint ran on it — an undocumented carve-out by omission. It is
// load-bearing (it produces port_signatures.json, the input to the SIGNATURES and
// DRIFT gates), so it gets the same bar as everything else. This source set exists
// only to lint+compile it; nothing depends on its output.
sourceSets {
    auditTools {
        java {
            srcDir 'scripts'
        }
    }
}

// runExample — compile every example, run the one named by -PexampleClass.
// Used by porting-sdk/scripts/examples_run.py (EXAMPLES-RUN gate) which calls
//   ./gradlew --no-daemon -q runExample -PexampleClass=<ClassName>
// once per example under the mock env. A server example that blocks past
// startup is killed by the gate's per-example timeout and counts as a PASS
// (it got past load); a crash-on-load exits non-zero with its stack trace.
tasks.register('runExample', JavaExec) {
    group = 'verification'
    description = 'Build + run one examples/ main by simple class name (-PexampleClass=SimpleAgent).'
    classpath = sourceSets.examples.runtimeClasspath
    // Default-package examples: the class name IS the main class.
    mainClass = providers.gradleProperty('exampleClass').orElse('')
    doFirst {
        if (!project.hasProperty('exampleClass') || project.property('exampleClass').toString().isEmpty()) {
            throw new GradleException(
                "runExample requires -PexampleClass=<ClassName> (e.g. -PexampleClass=SimpleAgent)")
        }
    }
    // Inherit the invoking process env (the gate exports SIGNALWIRE_* +
    // MOCK_SIGNALWIRE_PORT); pass through stdin/out so a crash surfaces.
    environment System.getenv()
    standardOutput = System.out
    errorOutput = System.err
}

// emitCorpus — the Java port's EMISSION-DUMP entry point for the cross-port
// emission differ (porting-sdk/scripts/diff_port_emission.py). Runs
// com.signalwire.sdk.tools.EmitCorpus, which builds the shared 81-entry
// FunctionResult corpus natively and prints one JSON object {id -> emission}
// to stdout (logs to stderr). Invoke quietly so only that JSON reaches stdout:
//   ./gradlew --no-daemon -q emitCorpus
// The differ runs `./gradlew --no-daemon -q emitCorpus` and byte-compares each
// entry against Python's to_dict(). Mirrors Go's cmd/emit-corpus.
tasks.register('emitCorpus', JavaExec) {
    group = 'verification'
    description = 'Dump the shared FunctionResult emission corpus as JSON (cross-port emission differ).'
    mainClass = 'com.signalwire.sdk.tools.EmitCorpus'
    classpath = sourceSets.main.runtimeClasspath
}

// emitSkills — the Java port's SKILL-DUMP entry point for the cross-port
// SKILL-CONTRACT differ (porting-sdk/scripts/diff_skill_contracts.py). Runs
// com.signalwire.sdk.tools.EmitSkills, which reads the shared skill corpus
// (porting-sdk/scripts/skill_contract_corpus.py), instantiates each covered
// skill, and prints one JSON object {id -> [tool-contract]} to stdout (logs to
// stderr). Invoke quietly so only that JSON reaches stdout:
//   ./gradlew --no-daemon -q emitSkills
// The differ runs `./gradlew --no-daemon -q emitSkills` and structurally
// compares each skill's tool contract against the Python reference. Sibling of
// emitCorpus; mirrors Go's cmd/emit-skills + Ruby's bin/emit-skills.
tasks.register('emitSkills', JavaExec) {
    group = 'verification'
    description = 'Dump the built-in skill tool contracts as JSON (cross-port skill-contract differ).'
    mainClass = 'com.signalwire.sdk.tools.EmitSkills'
    classpath = sourceSets.main.runtimeClasspath
}

// routeRegistry — the Java port's SET-B program for the cross-port SPEC-PARITY
// gate (porting-sdk/scripts/diff_spec_implementation.py --registry-json). Runs
// com.signalwire.sdk.rest.RouteRegistry, which drives the live RestClient
// through a recording HttpClient (records (method, path), returns an empty map,
// no network) and reflects over every namespace/sub-resource route method,
// invoking each with sentinel args — so it sees every dispatched route whether
// or not it's tested (not an AST scrape, not the journal). It prints ONE JSON
// object {routes,skipped,errors} to stdout (logs/errors to stderr) and exits
// non-zero if Set B is incomplete. Invoke quietly so only that JSON reaches
// stdout:
//   ./gradlew --no-daemon -q routeRegistry
// The SPEC-PARITY gate feeds that JSON to the shared diff via --registry-json.
// Mirrors Go's cmd/route-registry + TypeScript's scripts/route-registry.ts.
tasks.register('routeRegistry', JavaExec) {
    group = 'verification'
    description = 'Enumerate the REST routes the SDK implements as JSON (cross-port SPEC-PARITY gate).'
    mainClass = 'com.signalwire.sdk.rest.RouteRegistry'
    classpath = sourceSets.main.runtimeClasspath
}

// routeTestPlan — the per-via call plan the REST wire-test generator
// (scripts/generate_rest_tests.py) consumes. Runs com.signalwire.sdk.rest.
// RouteTestPlan, which drives the live RestClient through a recording HttpClient
// (same shape as RouteRegistry) and reflects over every route method, emitting
// per via the accessor chain, terminal member, and type-correct Java literal
// args. Prints ONE JSON object {plan,errors} to stdout, exits non-zero if any
// route is unreflectable. Invoke quietly so only that JSON reaches stdout:
//   ./gradlew --no-daemon -q routeTestPlan
tasks.register('routeTestPlan', JavaExec) {
    group = 'verification'
    description = 'Per-via REST call plan (chain/member/typed args) for the wire-test generator.'
    mainClass = 'com.signalwire.sdk.rest.RouteTestPlan'
    classpath = sourceSets.main.runtimeClasspath
}

// ── Layer-D per-surface dump programs ───────────────────────────────
// Each is a main() entry point in com.signalwire.sdk.tools that runs the
// shared behavioral corpus against the Java SDK's native API and prints ONE
// canonical JSON object {case-id -> observable-artifact} to stdout (logs to
// stderr). The porting-sdk differ (diff_port_<surface>.py) runs the task via
// `./gradlew --no-daemon -q <task>` and byte-compares each entry against the
// Python oracle. Mirrors Go's cmd/{wire,swml,wire-relay,http,state}-dump.

// wireDump — WIRE-CRYPTO differ (porting-sdk/scripts/diff_port_wire.py).
tasks.register('wireDump', JavaExec) {
    group = 'verification'
    description = 'Dump the wire-crypto corpus observations as JSON (cross-port wire differ).'
    mainClass = 'com.signalwire.sdk.tools.WireDump'
    classpath = sourceSets.main.runtimeClasspath
}

// aiChatDump — AI-CHAT wire-behavioral gate (porting-sdk/scripts/diff_port_ai_chat.py,
// on the `ai-chat-client` branch — a COORDINATED pass). Reads MOCK_AI_CHAT_URL +
// SIGNALWIRE_PROJECT_ID / SIGNALWIRE_API_TOKEN from the env the gate exports, drives the
// AIChatClient through the shared ai_chat_corpus against the in-process mock_ai_chat, and
// prints ONE JSON object to stdout. Run: `./gradlew -q --console=plain aiChatDump`.
tasks.register('aiChatDump', JavaExec) {
    group = 'verification'
    description = 'Dump the AI-Chat corpus observations as JSON (cross-port AI-CHAT differ).'
    mainClass = 'com.signalwire.sdk.tools.AIChatDump'
    classpath = sourceSets.main.runtimeClasspath
}

// swmlDump — SWML differ (porting-sdk/scripts/diff_port_swml.py).
tasks.register('swmlDump', JavaExec) {
    group = 'verification'
    description = 'Dump the SWML render corpus fragments as JSON (cross-port SWML differ).'
    mainClass = 'com.signalwire.sdk.tools.SwmlDump'
    classpath = sourceSets.main.runtimeClasspath
}

// strictRenderDump — SWML STRICT-RENDER differ
// (porting-sdk/scripts/diff_port_strict_render.py). Builds each strict_render
// corpus case in Java idiom, catches each build's exception as "raised" (clean
// = "ok"), and emits ONE JSON object {case-id -> "raised"|"ok"} to stdout.
// Invoke with --quiet --console=plain so only that JSON reaches stdout:
//   ./gradlew --quiet --console=plain strictRenderDump
tasks.register('strictRenderDump', JavaExec) {
    group = 'verification'
    description = 'Dump the strict-render corpus outcomes as JSON (cross-port strict-render differ).'
    mainClass = 'com.signalwire.sdk.tools.StrictRenderDump'
    classpath = sourceSets.main.runtimeClasspath
}

// stateDump — STATE differ (porting-sdk/scripts/diff_port_state.py).
tasks.register('stateDump', JavaExec) {
    group = 'verification'
    description = 'Dump the state-mutation corpus observations as JSON (cross-port state differ).'
    mainClass = 'com.signalwire.sdk.tools.StateDump'
    classpath = sourceSets.main.runtimeClasspath
}

// httpDump — HTTP differ (porting-sdk/scripts/diff_port_http.py).
tasks.register('httpDump', JavaExec) {
    group = 'verification'
    description = 'Dump the HTTP dispatch corpus observations as JSON (cross-port HTTP differ).'
    mainClass = 'com.signalwire.sdk.tools.HttpDump'
    classpath = sourceSets.main.runtimeClasspath
}

// wireRelayDump — RELAY differ (porting-sdk/scripts/diff_port_wire_relay.py).
tasks.register('wireRelayDump', JavaExec) {
    group = 'verification'
    description = 'Dump the RELAY frame + event corpus observations as JSON (cross-port relay differ).'
    mainClass = 'com.signalwire.sdk.tools.WireRelayDump'
    classpath = sourceSets.main.runtimeClasspath
}

// docWireRun — DOC-WIRE fixture runner (porting-sdk/scripts/doc_wire.py). Replays the
// documented REST fixtures against the flag-mode mock so the mock journals what the docs
// put on the wire; the gate fails on any journaled wire_violation.
tasks.register('docWireRun', JavaExec) {
    group = 'verification'
    description = 'Replay documented REST fixtures against the mock (DOC-WIRE fixture runner).'
    mainClass = 'com.signalwire.sdk.tools.DocWireRunner'
    classpath = sourceSets.main.runtimeClasspath
}

// waitLivenessDump — WAIT-LIVENESS differ (porting-sdk/scripts/diff_port_wait_liveness.py).
// Drives play/record verbs against an embedded RELAY mock, arms a delayed completing event,
// measures waitForCompletion() timing, and emits the liveness classification as JSON.
tasks.register('waitLivenessDump', JavaExec) {
    group = 'verification'
    description = 'Dump the wait()-liveness classification as JSON (cross-port liveness differ).'
    mainClass = 'com.signalwire.sdk.tools.WaitLivenessDump'
    classpath = sourceSets.main.runtimeClasspath
}

// envelopeDump — REST error-ENVELOPE differ (porting-sdk/scripts/diff_port_envelope.py, plan
// 1.3b transport-error typing). Runs com.signalwire.sdk.rest.EnvelopeDump, which drives the
// shared envelope corpus against the live mock_signalwire harness (MockTest -- probe-or-spawn on
// MOCK_SIGNALWIRE_PORT) and prints the per-case artifact JSON to stdout. Lives alongside MockTest
// in the test source set (it depends on MockTest's scenario/journal helpers), so this task uses
// the TEST runtime classpath, not main's.
tasks.register('envelopeDump', JavaExec) {
    group = 'verification'
    description = 'Dump the REST error-envelope corpus observations as JSON (cross-port envelope differ).'
    mainClass = 'com.signalwire.sdk.rest.EnvelopeDump'
    classpath = sourceSets.test.runtimeClasspath
    dependsOn 'testClasses'
}

// paginationDump — PAGINATION-CORPUS differ (porting-sdk/scripts/diff_port_pagination.py). Arms the
// three corpus page sequences FIFO on the mock's list endpoint and walks the real PaginatedIterator,
// emitting the per-fixture continued/guarded/terminated classification. Uses the TEST runtime
// classpath (depends on MockTest's harness), like envelopeDump.
tasks.register('paginationDump', JavaExec) {
    group = 'verification'
    description = 'Dump the REST pagination corpus classifications as JSON (cross-port pagination differ).'
    mainClass = 'com.signalwire.sdk.rest.PaginationDump'
    classpath = sourceSets.test.runtimeClasspath
    dependsOn 'testClasses'
}

// relayLivenessDump — RELAY-LIVENESS differ (porting-sdk/scripts/diff_port_relay_liveness.py).
// Drives the RelayClient through the shared relay-liveness corpus (cred/contract/dead-peer/
// black-hole/reconnect/max-active-calls) against embedded RELAY mocks and emits the per-fixture
// classification map.
tasks.register('relayLivenessDump', JavaExec) {
    group = 'verification'
    description = 'Dump the RELAY connection+error liveness classifications as JSON (cross-port relay-liveness differ).'
    mainClass = 'com.signalwire.sdk.relay.RelayLivenessDump'
    classpath = sourceSets.main.runtimeClasspath
}

// secureDefaultDump — SECURE-DEFAULT differ (porting-sdk/scripts/diff_port_secure_default.py).
// Renders SWML for a default (secure) tool + a secure=false tool and emits, per tool, the
// SDK-recorded secure flag plus that tool's SWAIG functions[] entry VERBATIM (token values
// redacted to <TOKEN>). The DIFFER classifies the payload; this task reports no verdict of its own.
tasks.register('secureDefaultDump', JavaExec) {
    group = 'verification'
    description = 'Dump the secure-default SWML rendered payloads as JSON (cross-port secure-default differ).'
    mainClass = 'com.signalwire.sdk.tools.SecureDefaultDump'
    classpath = sourceSets.main.runtimeClasspath
}

// tokenInteropMint — TOKEN-INTEROP checker (porting-sdk/scripts/diff_port_token_interop.py).
// Mints ONE token with the FIXED inputs the checker supplies in the environment and prints just
// that token, so the checker can validate it under the reference's own decoder — property 3 of the
// SWAIG tool-token contract (a correct key and a correct HMAC still leave the ENVELOPE encoding
// able to be wrong, and an unpadded token is unusable to every other implementation).
tasks.register('tokenInteropMint', JavaExec) {
    group = 'verification'
    description = 'Mint one SWAIG tool token with the checker-supplied fixed inputs (cross-port token-interop checker).'
    mainClass = 'com.signalwire.sdk.tools.TokenInteropMint'
    classpath = sourceSets.main.runtimeClasspath
    // Inherit the invoking process env — the checker exports SW_TOKEN_INTEROP_* into it, and
    // the fixture fails loud if they are missing (same convention as runExample above).
    environment System.getenv()
}

// secretScrubDump — SECRET-SCRUB-LIVE differ (porting-sdk/scripts/diff_port_secret_scrub.py).
// Drives the RelayClient through connect + an inbound authorization.state event at debug log level
// with fixture sentinel credentials, captures its own stdout+stderr, and reports per-sentinel
// whether it leaked.
tasks.register('secretScrubDump', JavaExec) {
    group = 'verification'
    description = 'Dump the secret-scrub leak classifications as JSON (cross-port secret-scrub differ).'
    mainClass = 'com.signalwire.sdk.tools.SecretScrubDump'
    classpath = sourceSets.main.runtimeClasspath
}

jar {
    manifest {
        attributes 'Implementation-Title': 'SignalWire AI Agents SDK',
                   'Implementation-Version': version
    }
}

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    // Sign publications ONLY when a signing key is configured. Maven Central
    // requires a GPG signature, so the release CI (publish.yml) supplies
    // ORG_GRADLE_PROJECT_signingInMemoryKey and this branch fires. A plain
    // `publishToMavenLocal` / local install (no key) must NOT drag in the
    // `signMavenPublication` task — otherwise every clean-environment local
    // publish fails "no configured signatory". Guarding the call keeps the
    // remote release signed while letting a local install (and the
    // package-smoke gate) resolve the artifact without a GPG key.
    if (project.hasProperty('signingInMemoryKey') || project.hasProperty('signing.keyId')) {
        signAllPublications()
    }

    pom {
        name = 'SignalWire AI Agents SDK'
        description = 'Java SDK for building, deploying, and managing SignalWire AI agents as microservices'
        url = 'https://github.com/signalwire/signalwire-java'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'signalwire'
                name = 'SignalWire'
                email = 'open.source@signalwire.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/signalwire/signalwire-java.git'
